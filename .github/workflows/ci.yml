name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  self-check:
    name: Run launch-check on the fixtures
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Broken fixture must fail the gate
        run: |
          set +e
          node dist/cli.js fixtures/vibe-app-broken --fail-on high --no-audit
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit 1, got $code"; exit 1; fi
      - name: Fixed fixture must pass the gate
        run: node dist/cli.js fixtures/vibe-app-fixed --fail-on low --md fixed-report.md
      - name: Dogfood on this repository
        run: node dist/cli.js . --no-audit
      - name: Try the reusable action (local)
        uses: ./
        with:
          path: fixtures/vibe-app-fixed
          fail-on: high
