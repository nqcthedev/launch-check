# Copy to .github/workflows/launch-check.yml in your app's repository.
# Fails the pull request when a high or critical production-readiness issue is introduced,
# and attaches the client-ready Markdown report to the run.
name: launch-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  launch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Option A: the reusable action (writes the report to the job summary too).
      - uses: OWNER/launch-check@v0.1.0 # replace OWNER with the GitHub user/org hosting launch-check
        with:
          fail-on: high

      # Option B: plain npx, no action needed.
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - run: npx --yes launch-check@0.1 . --fail-on high --md launch-check-report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check-report
          path: launch-check-report.md
